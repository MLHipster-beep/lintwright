[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lintwright"
version = "0.3.0"
description = "Static analysis for Debian source packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya", email = "aditya16011664@gmail.com" }]
keywords = ["debian", "packaging", "lintian", "ubuntu", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
lintwright = "lintwright.cli:main"

[project.urls]
Homepage = "https://github.com/MLHipster-beep/lintwright"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lintwright = ["py.typed"]

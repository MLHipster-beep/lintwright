name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v

  selfcheck:
    name: lintwright checks itself
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run against this repository
        run: PYTHONPATH=src python -m lintwright.cli check . --fail-on info

  package:
    name: build and lint the .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools lintian
      - name: Build
        run: dpkg-buildpackage -us -uc -b
      - name: lintian
        run: lintian --fail-on error ../lintwright_*.changes
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            ../lintwright_*.deb
            ../lintwright_*.changes
